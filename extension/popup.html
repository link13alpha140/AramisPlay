<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>AramisPlay Sync</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 315px;
      background: #0b111d;
      color: #f1f5f9;
      font-family: 'Segoe UI', system-ui, sans-serif;
      padding: 16px;
    }
    .head {
      display: flex;
      align-items: center;
      gap: 11px;
      margin-bottom: 14px;
    }
    .logo-img {
      width: 36px;
      height: 36px;
      border-radius: 9px;
      object-fit: cover;
    }
    h1 { font-size: 15px; font-weight: 700; color: #f8fafc; }
    .sub { font-size: 10.5px; color: #d4a853; font-weight: 700; letter-spacing: 0.6px; text-transform: uppercase; }

    .status-box {
      background: #101827;
      border: 1px solid rgba(148, 163, 184, 0.14);
      border-radius: 9px;
      padding: 11px 12px;
      margin-bottom: 12px;
      font-size: 12.5px;
    }
    .status-line { font-weight: 600; margin-bottom: 4px; display: flex; align-items: center; gap: 7px; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #64748b; display: inline-block; }
    .dot.on { background: #10b981; box-shadow: 0 0 6px #10b981; }
    .dot.off { background: #f59e0b; }
    .queue-line { color: #94a3b8; font-size: 11.5px; }

    button {
      width: 100%;
      border: 1px solid transparent;
      border-radius: 8px;
      padding: 9px 12px;
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
      transition: filter 0.15s;
    }
    button:hover { filter: brightness(1.08); }
    .btn-primary {
      background: linear-gradient(180deg, #e8c476, #d4a853);
      color: #090d16;
      font-weight: 700;
    }
    .btn-sec {
      background: #172338;
      border-color: rgba(148, 163, 184, 0.2);
      color: #e2e8f0;
    }
    #feedback {
      margin-top: 10px;
      font-size: 11.5px;
      color: #e8c476;
      line-height: 1.42;
    }
  </style>
</head>
<body>
  <div class="head">
    <img src="icons/icon48.png" class="logo-img" alt="AramisPlay" />
    <div>
      <h1>AramisPlay Sync</h1>
      <div class="sub">Anime-Sama · VOSTFR</div>
    </div>
  </div>

  <div class="status-box">
    <div class="status-line"><span class="dot" id="connDot"></span><span id="connStatus">Vérification…</span></div>
    <div class="queue-line" id="queueStatus">File d'attente : 0 épisode</div>
  </div>

  <button class="btn-primary" id="importHistoryBtn">Importer mon historique Anime-Sama</button>
  <button class="btn-sec" id="syncQueueBtn">Synchroniser la file d'attente</button>

  <div id="feedback"></div>

  <script src="popup.js"></script>
</body>
</html>
